request_metadata:
  api_version: string
  transaction_errors:
    - error_code: int
      error_level: string
      error_message: string
  transaction_uuid: string
  updated_from_windows: bool
client:
  metadata:
    errors:
      - error_code: int
        broken_component: string
        error_level: string
        error_message: string
        error_type: string
        is_broken: bool
        needs_attention: bool
    identifiers:
      client_uuid: string
      system_serial: string
      system_uuid: string
      property_tag: int
  app:
    config:
      UIT_CLIENT_DB_USER: string
      UIT_CLIENT_DB_PASSWD: string
      UIT_CLIENT_DB_NAME: string
      UIT_CLIENT_DB_HOST: string
      UIT_CLIENT_DB_PORT: string
      UIT_CLIENT_NTP_HOST: string
      UIT_CLIENT_PING_HOST: string
      UIT_SERVER_HOSTNAME: string
      UIT_WEB_HTTP_HOST: string
      UIT_WEB_HTTP_PORT: string
      UIT_WEB_HTTPS_HOST: string
      UIT_WEB_HTTPS_PORT: string
      UIT_WEBMASTER_NAME: string
      UIT_WEBMASTER_EMAIL: string
    live:
      hardware:
        battery_charge_pcnt: int
        battery_status: string
        cpu_usage_pcnt: float
        cpu_mhz: float
        cpu_temp: float
        disk_temp: float
        disk_max_temp: float
        memory_usage_kb: int
        memory_capacity_kb: int
        net_link_speed_kbit: int
        net_usage_kbit: float
        power_usage_watts: float
      job: 
        clone_mode: string
        erase_mode: string
        is_queued: bool
        is_running: bool
        name: string
        name_formatted: string
        disk_image_name: string
        queue_position: int
      status:
        app_uptime: int
        current: string
        is_online: bool
        is_plugged_in: bool
        kernel_updated: bool
        last_heard: timestamp
        system_uptime: int
      live_screenshot: 
        - byte
    version: string
  firmware:
    bios:
      release_date: timestamp
      version: string
    disk:
      is_encrypted: bool
    secure_boot:
      enabled: bool
      has_2023_MS_CA: bool
    tpm:
      enabled: bool
      is_present: bool
      public_key_hash: string
      version: string
  hardware:
    metadata:
      errors:
        - error_code: int
          broken_component: string
          error_level: string
          error_message: string
          error_type: string
          is_broken: bool
          needs_attention: bool
      last_updated: timestamp
    cpu:
      core_count: int
      manufacturer: string
      max_speed_mhz: int
      model: string
      thread_count: int
    disk:
      - serial: string
        capacity_available_kb: int
        capacity_kb: int
        firmware_version: string
        health:
          health_pcnt: float
          power_cycles: int
          power_on_hours: int
          smart_errors: int
          total_reads_kb: int
          total_writes_kb: int
        interface: string
        is_removed: bool
        manufacturer: string
        model: string
    memory:
      - serial: string
        capacity_kb: int
        speed_mhz: int
    net:
      ethernet:
        - mac_addr: string
          if_name: string
          is_present: bool
          link_speed_mbit: int
      wifi:
        - mac_addr: string
          if_name: string
          is_present: bool
          max_supported_protocol: string
    power:
      battery:
        factory_capacity: int
        health:
          charge_cycles: int
          current_max_capacity: int
          health_pcnt: float
        is_present: bool
        manufacture_date: timestamp
        manufacturer: string
        model: string
        serial: string
  jobs:
    most_recent:
      clone:
        disk_image_name: string
        duration: int
        job_completed_at: timestamp
        job_started_at: timestamp
        successful: bool
      erase:
        duration: int
        exists: bool
        job_completed_at: timestamp
        job_started_at: timestamp
        mode: string
        successful: bool
  init:
    serial: string
    property_tag: int
  lookup_ids:
    client_uuid: string
    serial: string
    property_tag: int
    return_all: bool
  os:
    metadata:
      last_updated: timestamp
    architecture: string
    hostname: string
    installed_at: timestamp
    is_installed: bool
    name: string
    platform: string
    vendor: string
    version: string
    windows:
      admin_users:
      - string_arr
      build_number: int
      ad:
        computer_name: string
        dn_string: string
        domain_name: string
        is_domain_joined: bool
        is_intune_joined: bool
        ou_name: string
        sid: string
      display_version: string
      ubr: int
  software:
    metadata:
      last_updated: timestamp
    windows:
      installed_apps:
        - app_name: string
  system:
    manufacturer: string
    model: string
    system_device_type: string
    system_serial: string
    system_sku: string
    system_uuid: string
host:
  admin:
    app_state:
      overview:
        - timeout_duration: int
        - ip_addr: string
          api_limiter_map:
            type: string
            last_seen: timestamp
          auth_limiter_map:
            type: string
            last_seen: timestamp
          file_limiter_map:
            type: string
            last_seen: timestamp
          webserver_limiter_map:
            type: string
            last_seen: timestamp
    realtime_data:
      - property_tag: int
        client_uuid: string
        serial: string
        last_heard: timestamp
        last_heard_in_db: timestamp
        system_uptime: timestamp
        app_uptime: timestamp
        live_screenshot: byte_arr
  list_all:
    ad_domains:
      - string_arr
    ad_ous:
      - string_arr
    buildings_and_rooms:
      - building: string
        room: string
    device_types:
      - string_arr
    job_names:
      - string_arr
    locations:
      - string_arr
    models:
      - string_arr
    statuses:
      - string_arr
  auth:
    is_valid: bool
    login:
      client_ip: ip address
      password: string
      username: string
  bulk_update:
    locations:
      metadata:
        request_timestamp: timestamp
        transaction_uuid: string
      property_tag: int
      location: string
  inventory:
    overview: {}
  server_time:
    now: timestamp
inventory:
  metadata:
    last_updated: timestamp
  checkouts:
    historical_log:
      - transaction_uuid: string
        checkout_date: timestamp
        customer_name: string
        log_entry_time: timestamp
        return_date: timestamp
    is_checked_out: bool
  client_note: string
  files:
    data:
      bytes: byte_arr
    manifest:
      - file_uuid: string
        caption: string
        file_size_kb: int
        file_type: string
        file_url: string
        image_data:
          resolution_x: int
          resolution_y: int
        mime_type: string
        pinned: bool
        sha256_hash: string
        upload_timestamp: timestamp
        video_data:
          resolution_x: int
          resolution_y: int
          duration: int
  location:
    building: string
    department: string
    description: string
    room: string
  new_uuid_v7: string
  property:
    acquired_date: timestamp
    custodian: string
    retired_date: timestamp
job_queue:
  is_job_available: bool
  overview: {}
web:
